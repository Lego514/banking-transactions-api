name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run tests
        run: mvn -B verify
        env:
          # Turns on the PostgreSQL-backed tests (Testcontainers). The runner
          # has Docker; a machine without it skips them instead of failing.
          # Set explicitly rather than auto-detecting Docker, so a broken Docker
          # here fails the build instead of silently skipping the tests.
          POSTGRES_TESTS: "true"

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
